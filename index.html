<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0F2741">
<title>Rebus Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 18px 40px; min-height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { font-weight: 900; letter-spacing: .14em; font-size: 14px; }
  .brand b { color: var(--acc); }
  .card { background: var(--card); border-radius: 18px; padding: 22px; }
  h1 { font-size: 30px; margin: 6px 0 6px; line-height: 1.15; }
  .sub { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 18px; }
  .stack > * + * { margin-top: 14px; }
  .center { text-align: center; }
  .big { font-size: 46px; font-weight: 900; line-height: 1.05; }
  .qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 800; }
  .qhead .sp { flex: 1; }
  .secs { font-size: 26px; font-weight: 900; color: var(--acc); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .secs.low { color: var(--bad); }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0 14px; }
  .ansrow { display: flex; gap: 10px; }
  .ansrow .field { flex: 1; font-size: 20px; }
  .locked { background: #0b1f35; border: 2px dashed var(--line); border-radius: 14px; padding: 16px; text-align: center; }
  .locked b { color: var(--acc); }
  .res { font-size: 40px; font-weight: 900; margin: 8px 0; }
  .stat { display: flex; justify-content: center; gap: 26px; margin-top: 14px; }
  .stat div { text-align: center; }
  .stat b { display: block; font-size: 28px; }
  .stat span { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .toplist { margin-top: 18px; }
  .toprow { display: flex; justify-content: space-between; padding: 10px 14px; background: #0b1f35; border-radius: 10px; margin-bottom: 6px; font-weight: 700; }
  .toprow.me { outline: 2px solid var(--acc); }
  .zoom { position: fixed; inset: 0; background: rgba(5,15,28,.95); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 10px; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 12px; }
  .err { color: var(--bad); font-size: 14px; margin-top: 8px; min-height: 18px; }
  .foot { margin-top: auto; padding-top: 24px; text-align: center; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">REBUS <b>CHALLENGE</b></div><span class="pill"><i id="dot" class="dot"></i><span id="dotTxt"></span></span></div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="zoom" class="zoom hidden"><img id="zoomImg" alt=""></div>

<script src="common.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  let code = RB.cleanCode(params.get('room'));
  let me = code ? RB.load('rebus-me-' + code) : null;
  let H = null;               // latest host state
  let deadline = 0;           // local timestamp when the current question closes
  let sub = null, tick = null, viewKey = '', lastJoinSent = 0;
  const ansKey = () => 'rebus-ans-' + code + '-' + (me ? me.id : '');
  const myAns = () => RB.load(ansKey()) || {};

  function setStatus(on) {
    document.getElementById('dot').className = 'dot ' + (on ? 'on' : 'off');
    document.getElementById('dotTxt').textContent = on ? 'Connected' : 'Reconnecting…';
  }

  /* ---------- join ---------- */
  function renderJoin(err) {
    viewKey = 'join';
    const last = RB.load('rebus-lastname') || '';
    app.innerHTML = `
      <div class="card stack">
        <h1>Join the game</h1>
        <p class="sub">Each picture hides a word or phrase. Type it in before time runs out. Faster correct answers score more.</p>
        ${code ? '' : `<div><label class="lbl" for="code">Game code</label><input id="code" class="field" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="e.g. K7QXM"></div>`}
        <div><label class="lbl" for="name">Your name</label><input id="name" class="field" maxlength="24" autocomplete="off" placeholder="First name is fine" value="${RB.esc(last)}"></div>
        <button id="joinBtn" class="btn big" style="width:100%">Join ▶</button>
        <div class="err" id="err">${RB.esc(err || '')}</div>
      </div>`;
    const go = () => {
      const c = code || RB.cleanCode(document.getElementById('code').value);
      const n = RB.cleanName(document.getElementById('name').value);
      if (!c) return renderJoin('Enter the game code shown on the host screen.');
      if (!n) return renderJoin('Enter your name.');
      code = c;
      const prev = RB.load('rebus-me-' + code);
      me = { id: (prev && prev.id) || RB.rid(), name: n };
      RB.store('rebus-me-' + code, me);
      RB.store('rebus-lastname', n);
      if (!params.get('room')) history.replaceState(null, '', '?room=' + code + (RB.MOCK ? '&mock=1' : ''));
      start();
    };
    document.getElementById('joinBtn').onclick = go;
    app.querySelectorAll('input').forEach((i) => (i.onkeydown = (e) => { if (e.key === 'Enter') go(); }));
    setTimeout(() => { const f = document.getElementById(code ? 'name' : 'code'); f && f.focus(); }, 50);
  }

  function sendJoin() {
    lastJoinSent = Date.now();
    RB.publish(RB.topic(code, 'p'), { t: 'join', id: me.id, name: me.name });
  }

  function start() {
    document.getElementById('foot').innerHTML = `Playing as <b>${RB.esc(me.name)}</b> · game ${RB.esc(code)} · <a href="#" id="chg" style="color:var(--muted)">change name</a>`;
    document.getElementById('chg').onclick = (e) => { e.preventDefault(); if (sub) sub.close(); sub = null; H = null; renderJoin(); };
    sendJoin();
    if (sub) sub.close();
    sub = RB.subscribe(RB.topic(code, 'h'), 'all', onHost, setStatus);
    render();
  }

  /* ---------- host messages ---------- */
  function onHost(b, m) {
    if (!b || b.t !== 'st') return;
    H = b;
    if (b.ph === 'q') {
      let age = Date.now() / 1000 - (m.time || Date.now() / 1000);
      if (age < 2.5) age = 0;  // live message: trust arrival time
      deadline = Date.now() + Math.max(0, (b.left || 0) - age) * 1000;
    }
    // Make sure the host knows about us (e.g. if our join got lost).
    const known = b.ph === 'lobby' ? (b.pl || []).some((p) => p[0] === me.id)
      : b.ph === 'q' ? (b.ids || []).includes(me.id)
      : b.r ? me.id in b.r : true;
    if (!known && Date.now() - lastJoinSent > 6000) sendJoin();
    render();
  }

  /* ---------- views ---------- */
  function render() {
    if (!me) return renderJoin();
    const key = H ? H.ph + ':' + H.q + ':' + (myAns()[H.q] != null ? 'a' : '') : 'wait';
    if (H && H.ph === 'q' && key === viewKey) { updateTimer(); return; }   // keep the typed text
    viewKey = key;
    clearInterval(tick);
    if (!H) return waitView('You\'re in, ' + me.name + '!', 'Waiting for the host to open the game…');
    if (H.ph === 'lobby') return waitView('You\'re in, ' + me.name + '!', `Waiting for the host to start. <b class="acc">${(H.pl || []).length}</b> player${(H.pl || []).length === 1 ? '' : 's'} joined so far.`);
    if (H.ph === 'q') return questionView();
    if (H.ph === 'rev') return resultView();
    if (H.ph === 'lb') return boardView();
    if (H.ph === 'end') return endView();
  }

  function waitView(title, text) {
    app.innerHTML = `
      <div class="card stack center">
        <div style="font-size:52px">🧩</div>
        <h1>${RB.esc(title)}</h1>
        <p class="sub">${text}</p>
        <img class="puzzle-img" src="img/example.jpg" alt="Example puzzle">
        <p class="sub" style="margin:0">Example: <b>I</b> over <b>STAND</b> = <b class="acc">I understand</b></p>
      </div>`;
  }

  function questionView() {
    const P = RB.PUZZLES[H.q];
    const mine = myAns()[H.q];
    app.innerHTML = `
      <div class="qhead"><span>Puzzle ${H.q + 1} <span class="muted">of ${H.N}</span></span><span class="sp"></span><span id="secs" class="secs"></span></div>
      <div id="bar" class="bar" style="margin-bottom:14px"><i style="width:100%"></i></div>
      <img id="pimg" class="puzzle-img" src="${P.img}" alt="Puzzle ${H.q + 1}">
      <div class="hint">Tap the picture to enlarge it</div>
      <div id="ansArea"></div>`;
    document.getElementById('pimg').onclick = () => openZoom(P.img);
    const area = document.getElementById('ansArea');
    if (mine != null) {
      area.innerHTML = `<div class="locked">Answer locked in: <b>${RB.esc(mine)}</b><br><span class="muted">Wait for the reveal…</span></div>`;
    } else {
      area.innerHTML = `
        <div class="ansrow"><input id="ans" class="field" maxlength="60" placeholder="Type your answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"><button id="send" class="btn">Send</button></div>
        <div class="err" id="err"></div>`;
      const send = async () => {
        const f = document.getElementById('ans'), btn = document.getElementById('send');
        const a = f.value.trim();
        if (!a) { f.focus(); return; }
        if (Date.now() > deadline + 1000) { document.getElementById('err').textContent = "Time's up for this one."; return; }
        btn.disabled = true; f.disabled = true;
        const ok = await RB.publish(RB.topic(code, 'p'), { t: 'ans', id: me.id, name: me.name, q: H.q, a });
        if (ok) { const all = myAns(); all[H.q] = a; RB.store(ansKey(), all); render(); }
        else { btn.disabled = false; f.disabled = false; document.getElementById('err').textContent = "Couldn't send. Check your connection and tap Send again."; }
      };
      document.getElementById('send').onclick = send;
      document.getElementById('ans').onkeydown = (e) => { if (e.key === 'Enter') send(); };
      setTimeout(() => { const f = document.getElementById('ans'); f && f.focus(); }, 60);
    }
    tick = setInterval(updateTimer, 200);
    updateTimer();
  }
  function updateTimer() {
    const s = document.getElementById('secs'), b = document.getElementById('bar');
    if (!s || !H || H.ph !== 'q') return;
    const left = Math.max(0, (deadline - Date.now()) / 1000);
    s.textContent = Math.ceil(left);
    s.classList.toggle('low', left <= 5);
    b.classList.toggle('low', left <= 5);
    b.firstElementChild.style.width = Math.min(100, 100 * left / (H.dur || 30)) + '%';
    if (left <= 0) {
      const f = document.getElementById('ans');
      if (f && !f.disabled) { f.disabled = true; document.getElementById('send').disabled = true; document.getElementById('err').textContent = "Time's up! Waiting for the reveal…"; }
    }
  }

  const mineR = () => (H.r && H.r[me.id]) || null;
  function statBlock(r, n) {
    return `<div class="stat"><div><b>${RB.fmt(r ? r[2] : 0)}</b><span>Total</span></div><div><b>${r && r[3] ? '#' + r[3] : '-'}</b><span>of ${n || '?'}</span></div></div>`;
  }
  function resultView() {
    const r = mineR(), P = RB.PUZZLES[H.q];
    const head = !r || r[0] === -1 ? `<div class="res muted">No answer</div>`
      : r[0] === 1 ? `<div class="res ok">✓ Correct!</div><div class="big ok">+${RB.fmt(r[1])}</div>`
      : `<div class="res bad">✗ Not quite</div><p class="sub">You said: <b>${RB.esc(myAns()[H.q] || '')}</b></p>`;
    app.innerHTML = `
      <div class="card stack center">
        ${head}
        <img class="puzzle-img" src="${P.img}" alt="">
        <p class="sub" style="margin:0">Answer: <b class="acc">${RB.esc(H.ans || P.answer)}</b></p>
        ${statBlock(r, H.n)}
      </div>`;
  }
  function topList() {
    return `<div class="toplist">${(H.top || []).map((t, i) => `<div class="toprow ${t[0] === me.name ? 'me' : ''}"><span>${i + 1}. ${RB.esc(t[0])}</span><span>${RB.fmt(t[1])}</span></div>`).join('')}</div>`;
  }
  function boardView() {
    const r = mineR();
    app.innerHTML = `
      <div class="card center">
        <p class="sub" style="margin:0">After puzzle ${H.q + 1} of ${H.N}</p>
        <h1>${r && r[3] ? 'You\'re #' + r[3] : 'Leaderboard'}</h1>
        ${statBlock(r, H.n)}
        ${topList()}
        <p class="sub" style="margin-top:16px">Next puzzle coming up…</p>
      </div>`;
  }
  function endView() {
    const r = mineR();
    const medal = r && r[3] === 1 ? '🥇' : r && r[3] === 2 ? '🥈' : r && r[3] === 3 ? '🥉' : '🎉';
    app.innerHTML = `
      <div class="card center">
        <div style="font-size:64px">${medal}</div>
        <h1>${r && r[3] ? 'You finished #' + r[3] : 'Game over'}</h1>
        ${statBlock(r, H.n)}
        ${topList()}
        <p class="sub" style="margin-top:16px">Thanks for playing!</p>
      </div>`;
  }

  function openZoom(src) {
    const z = document.getElementById('zoom');
    document.getElementById('zoomImg').src = src;
    z.classList.remove('hidden');
    z.onclick = () => z.classList.add('hidden');
  }

  if (code && me) start(); else renderJoin();
})();
</script>
</body>
</html>
